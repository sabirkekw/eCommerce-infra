apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce-dev
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: api.sabirkekw.dev
    http:
      paths:
      - path: /v1/auth
        pathType: Prefix
        backend:
          service:
            name: sso-service
            port:
              number: 8081
      - path: /v1/products
        pathType: Prefix
        backend:
          service:
            name: products-service
            port:
              number: 8080