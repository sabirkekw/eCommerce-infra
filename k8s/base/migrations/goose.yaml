apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-all
  namespace: ecommerce-dev
spec:
  template:
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: goose
        image: ghcr.io/sabirkekw/ecommerce_go-goose:latest
        commands:
          - name: Migrate SSO DB
            command: ["goose", "postgres", $SSO_DB_STRING, "up"]
          - name: Migrate Products DB
            command: ["goose", "postgres", $PRODUCTS_DB_STRING, "up"]
        env:
        - name: SSO_DB_STRING
          value: "host=postgres-sso-service user=postgres password=postgres dbname=sso_db sslmode=disable"
        - name: PRODUCTS_DB_STRING
          value: "host=postgres-products-service user=postgres password=postgres dbname=products_db sslmode=disable"
        volumeMounts:
      restartPolicy: OnFailure
  backoffLimit: 4